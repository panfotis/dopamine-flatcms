# No `name:` on purpose. DDEV falls back to the directory name, so
# `composer create-project … my-site` gives a project called my-site at
# my-site.ddev.site. A name pinned here would put every site a developer
# creates at the same hostname, and the second one would collide.
type: php
docroot: public
php_version: "8.4"
webserver_type: nginx-fpm
composer_version: "2"
xdebug_enabled: false

# No database anywhere in this project. Dropping the container saves ~300 MB of
# RAM per project — worth it when several DDEV projects are up at once.
omit_containers: [db]

web_environment:
  # Skips Cloudflare Access locally. This is the ONLY place it may be 1.
  # It is an explicit flag: the code never infers it from REMOTE_ADDR, because
  # in DDEV every request arrives from the router container anyway.
  - AUTH_DEV_BYPASS=1
  - AUTH_MODE=cf_access

  # SITE_BASE_URL is deliberately absent: config.php falls back to
  # DDEV_PRIMARY_URL, which DDEV sets to this project's real URL whatever the
  # directory is called. Pinning it here would hardcode one hostname into every
  # site, and img() builds absolute URLs from it — so a wrong value is wrong on
  # every share card rather than visibly broken.

  # Mailpit ships with DDEV — `ddev mailpit` opens the inbox. Used from the
  # contact-form phase onward.
  - MAIL_DSN=smtp://localhost:1025

  # Cloudflare features off locally: uploads stay in content/uploads,
  # images are served untransformed, saves skip the purge call.
  - R2_ENABLED=
  - CF_IMAGES_ENABLED=
  - CF_PURGE_ENABLED=

hooks:
  post-start:
    - exec: composer install --no-interaction
    # Writable by the web user, and never committed.
    - exec: mkdir -p var/cache var/locks content/uploads content/.revisions
