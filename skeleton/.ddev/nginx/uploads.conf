# Uploads live in content/uploads/, outside the docroot, so that one clone of
# the content repository restores the pages *and* the images on them. This is
# the same alias production uses — see nginx.conf.example — so local and live
# serve them identically and stored `src` values stay `/uploads/...` either way.
#
# An include rather than an edit to nginx_full/nginx-site.conf: that file is
# #ddev-generated and gets rewritten on every `ddev restart`. Files here are
# included into the server block and survive.
location /uploads/ {
    alias /var/www/html/content/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";

    # Uploaded files are never executed, whatever their extension. This is the
    # reason the directory must not be reachable by any other path.
    location ~ \.php$ { return 403; }
}
