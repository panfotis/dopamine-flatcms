label: Contact form
description: A form that emails the message and keeps a copy on the server.

# ── What the visitor fills in. Developer-owned. ──────────────────────────────
# This is NOT a `fields:` entry and never becomes one: a client who could edit
# this list could add an input, and an input is where a value comes from. The
# client edits the words around the form; the form itself is yours.
#
# Types: text, email, tel, textarea, select, radio, checkbox. select and radio
# take `options:` (list or map); give a select an empty-keyed first option as
# the placeholder — `'': '—'` — or `required` cannot refuse it.
form:
  name:
    label: form.name
    type: text
    required: true
    max: 80
  email:
    label: form.email
    type: email
    required: true
    max: 120
  phone:
    label: form.phone
    type: tel
    max: 30
  message:
    label: form.message
    type: textarea
    required: true
    max: 2000

# ── What the client edits. ───────────────────────────────────────────────────
fields:
  heading:
    type: text
    label: Heading
    max: 60
    required: true

  intro:
    type: textarea
    label: Intro text
    max: 300

  success:
    type: textarea
    label: Success message
    max: 300
    default: Thank you! We received your message and will be in touch shortly.

  # Empty = no consent checkbox at all. A site that does not need one should
  # not show one, and a checkbox with no text beside it is worse than none.
  consent_text:
    type: text
    label: Consent text (GDPR)
    max: 200
    default: I agree to be contacted about my request.

  # `editable: admin`, and for the same reason the Turnstile toggle below is:
  # as client-editable text this redirects every lead off-site — or fans out to
  # a second address with a comma. Validated as exactly one address on the way
  # out, so a value that is not one is not used at all.
  recipient:
    type: text
    label: Recipient (email)
    editable: admin
    max: 120
    hint: Where messages are delivered. One address. Empty = the site-wide setting.

  # Off by default. Rate limit + honeypot + minimum time-to-submit is the
  # always-on baseline and stops effectively all drive-by bots on a brochure
  # site; this is the fourth layer for a site that proves it needs one.
  #
  # `editable: admin` because a spam control the client can switch off is not a
  # spam control. Enforced on save, not merely locked in the form.
  turnstile:
    type: boolean
    label: Cloudflare Turnstile check
    editable: admin
    hint: Needs TURNSTILE_SITE_KEY and TURNSTILE_SECRET in .env. Without them it behaves as off.
