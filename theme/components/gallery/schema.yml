label: Gallery
description: A photo grid. The client uploads, reorders and removes.

fields:
  heading:
    type: text
    label: Heading
    max: 60

  # A gallery is its own type, not a `list` with one image inside: thirty
  # photos through a generic repeater is thirty stacked cards, which is
  # unusable. The validation is the same walk either way.
  #
  # Alt is optional in here and required on a standalone image — a client who
  # must describe thirty photos before the save goes through writes thirty junk
  # strings, and a screen reader reads those out instead of skipping them.
  photos:
    type: image_list
    label: Photos
    max: 30
    hint: Select several at once. The description is optional here — write it where it carries meaning.
