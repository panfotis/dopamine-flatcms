label: Contact details
description: A page closer with phone, email and address.

fields:
  heading:
    type: text
    label: Heading
    max: 60
    required: true

  phone:
    type: text
    label: Phone
    max: 30

  # The address the site publishes is a business decision, not copy: changing
  # it silently redirects every enquiry the client gets. Editors see it and
  # cannot change it; admins can. Enforced on save, not merely disabled here.
  email:
    type: text
    label: Email
    max: 60
    editable: admin

  address:
    type: textarea
    label: Address
    max: 140
