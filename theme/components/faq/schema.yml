label: FAQ
description: A list of questions and answers.

fields:
  heading:
    type: text
    label: Heading
    max: 60

  # A real YAML boolean on disk, not the string "1". Templates branch on it.
  open_first:
    type: boolean
    label: First question open by default

  # A repeater over a fixed sub-schema. `max` is the ceiling the save path cuts
  # to *before* it sanitises anything, so it bounds work as well as content.
  # `item_label` names which sub-field titles each row in the panel.
  questions:
    type: list
    label: Questions
    max: 20
    item_label: question
    hint: The client adds and removes rows. The fields inside each row are yours.
    fields:
      question:
        type: text
        label: Question
        max: 140
        required: true
      answer:
        type: richtext
        label: Answer
