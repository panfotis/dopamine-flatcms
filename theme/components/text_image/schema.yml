label: Κείμενο με εικόνα
description: Ενότητα με τίτλο, κείμενο και εικόνα στο πλάι.

fields:
  heading:
    type: text
    label: Τίτλος
    max: 80

  body:
    type: richtext
    label: Κείμενο
    hint: Επιτρέπονται έντονα, πλάγια, λίστες και σύνδεσμοι.

  # No `image_alt` beside it any more: alt lives inside the image object, so it
  # arrives with the field instead of being remembered separately.
  image:
    type: image
    label: Εικόνα

  media_side:
    type: select
    label: Θέση εικόνας
    editable: false
    options:
      end: Δεξιά
      start: Αριστερά
    default: end
