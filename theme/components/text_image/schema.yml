label: Text with image
description: A section with a heading, text and an image beside it.

fields:
  heading:
    type: text
    label: Heading
    max: 80

  body:
    type: richtext
    label: Text
    hint: Bold, italics, lists and links are allowed.

  # No `image_alt` beside it any more: alt lives inside the image object, so it
  # arrives with the field instead of being remembered separately.
  image:
    type: image
    label: Image

  media_side:
    type: select
    label: Image position
    editable: false
    options:
      end: Right
      start: Left
    default: end
