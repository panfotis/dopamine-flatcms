label: Video
description: A YouTube or Vimeo video, or a short muted loop.

fields:
  heading:
    type: text
    label: Heading
    max: 60

  # The client pastes what is in their address bar. What is stored is a
  # provider and an id — never HTML — and video.twig builds the iframe, on
  # click, from youtube-nocookie.com. Nothing third-party loads until then, so
  # the site sets no third-party cookie and needs no banner for one.
  embed:
    type: video_embed
    label: YouTube or Vimeo link
    hint: Paste the address from the browser bar.

  # Not the provider's auto-generated thumbnail: fetching that is an SSRF
  # surface for a picture the client did not choose and usually would not have.
  # This is an ordinary image field, uploaded like every other.
  poster:
    type: image
    label: Poster image
    hint: Shown before anyone presses play.

  # Self-hosted alternative: a short muted clip behind the section. Hard 10 MB
  # cap, no transcoding — anything longer belongs on YouTube.
  loop:
    type: video_loop
    label: Loop video (MP4)
    hint: Muted, up to 10 MB. For anything longer, use the YouTube link above.
