label: Κεντρική ενότητα
description: Η μεγάλη ενότητα στην κορυφή της σελίδας.

fields:
  heading:
    type: text
    label: Τίτλος
    max: 70
    required: true

  subheading:
    type: textarea
    label: Υπότιτλος
    max: 180
    hint: Μία ή δύο προτάσεις. Κρατήστε το σύντομο.

  # It sits behind the heading, carries no information of its own, and alt=""
  # is the correct markup for it. Declared here because whether an image is
  # meaningful or decorative is a design decision — the client cannot know it,
  # and a forged `decorative` in a request is dropped like any other undeclared
  # key.
  image:
    type: image
    label: Εικόνα φόντου
    decorative: true

  cta_label:
    type: text
    label: Κείμενο κουμπιού
    max: 30

  cta_url:
    type: link
    label: Σύνδεσμος κουμπιού
    placeholder: /epikoinonia

  # The client picks copy, not layout. Flip `editable` to true if you ever
  # want to hand a specific site's alignment over to them.
  align:
    type: select
    label: Στοίχιση
    editable: false
    options:
      start: Αριστερά
      center: Κέντρο
    default: center
