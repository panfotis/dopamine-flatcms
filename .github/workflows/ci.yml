name: CI

# The three things a deploy runs, run on every push instead — so a change that
# would fail a deploy fails here first, where nobody is waiting.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # Pinned to the version production runs. A suite green on 8.5 and red
          # on 8.4 is worse than no CI.
          php-version: '8.4'
          extensions: curl, dom, exif, gd, json, openssl
          coverage: none
          ini-values: memory_limit=256M

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Lint
        run: |
          find src public bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
          bash -n bin/deploy.sh
          bash -n bin/rollback.sh
          bash -n bin/release.sh
          bash -n bin/backup
          bash -n bin/restore-drill
          bash -n bin/new-site

      - name: Doctor
        run: php bin/doctor

      # 06 and 07 make real HTTPS requests to the DDEV origin, which does not
      # exist here. They are the deploy's job; the rest run on every push.
      - name: Tests
        run: |
          for t in tests/0[1-5]_*.php; do
            echo "── $(basename "$t")"
            php "$t"
          done
