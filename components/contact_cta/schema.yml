label: Στοιχεία επικοινωνίας
description: Κλείσιμο σελίδας με τηλέφωνο, email και διεύθυνση.

fields:
  heading:
    type: text
    label: Τίτλος
    max: 60
    required: true

  phone:
    type: text
    label: Τηλέφωνο
    max: 30

  # The address the site publishes is a business decision, not copy: changing
  # it silently redirects every enquiry the client gets. Editors see it and
  # cannot change it; admins can. Enforced on save, not merely disabled here.
  email:
    type: text
    label: Email
    max: 60
    editable: admin

  address:
    type: textarea
    label: Διεύθυνση
    max: 140
