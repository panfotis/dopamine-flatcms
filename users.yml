# Who may use the panel, and as what.
#
# Cloudflare Access decides *who you are*. This file decides *what you may do*.
# The two are deliberately separate: an address that authenticates but is not
# listed here gets a 403, not an implicit editor role. Without that rule,
# adding somebody to the Access application — which is a login decision, often
# made by whoever administers the client's Google Workspace — silently hands
# them the content of every page.
#
# ── Adding a person is therefore TWO steps, in two places ───────────────────
#
#   1. Cloudflare Zero Trust → Access → the /admin.php application → policy.
#      Lets them past the login. Cloudflare never reads this file and has no
#      idea these roles exist; nothing here is pushed or synced to it.
#   2. This file, committed and deployed. Decides what they can do once in.
#
# Miss step 1 and they never reach PHP — Cloudflare refuses them at the edge.
# Miss step 2 and they log in successfully and get our 403; the refusal is
# written to the error log with the address to add, because the alternative is
# the client telephoning to say the panel is broken.
#
# Removing access is the reverse, and step 1 is the one that matters: deleting
# a row here stops them editing, but only the Access policy stops them holding
# a valid session.
#
# Roles:
#   admin  — edits every field including `editable: admin`, lists and restores
#            revisions
#   editor — edits `editable: true` fields, and nothing else
#
# A row whose role is neither of those is ignored rather than guessed at: a
# typo here must cost somebody their access, never grant it.
#
# No secrets. Safe to commit. In production this file lives in shared/ and is
# pointed at by ROLES_FILE, so it survives a deploy and APP_ENV=prod refuses to
# boot without it — see tests/fixtures/production.env.
- { email: admin@example-domain.com, role: admin }
- { email: editor@example-domain.com,  role: editor }
